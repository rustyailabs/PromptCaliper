<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#111111"/>
  <!-- Outer ring (border-[var(--ral-rust-core)]) -->
  <circle cx="32" cy="32" r="28" stroke="#C0531A" stroke-width="3" fill="none"/>

  <!-- Cpu icon (lucide Cpu, centered at 32,32, size ~28px) -->
  <!-- Chip body -->
  <rect x="20" y="20" width="24" height="24" rx="3" stroke="#C0531A" stroke-width="2.5" fill="none"/>
  <!-- Inner square -->
  <rect x="25" y="25" width="14" height="14" rx="1.5" stroke="#C0531A" stroke-width="2" fill="#C0531A" fill-opacity="0.2"/>
  <!-- Top pins -->
  <line x1="25" y1="20" x2="25" y2="16" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="32" y2="16" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="39" y1="20" x2="39" y2="16" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Bottom pins -->
  <line x1="25" y1="44" x2="25" y2="48" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="48" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="39" y1="44" x2="39" y2="48" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left pins -->
  <line x1="20" y1="25" x2="16" y2="25" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="16" y2="32" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="20" y1="39" x2="16" y2="39" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right pins -->
  <line x1="44" y1="25" x2="48" y2="25" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="48" y2="32" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="44" y1="39" x2="48" y2="39" stroke="#C0531A" stroke-width="2.2" stroke-linecap="round"/>
</svg>
